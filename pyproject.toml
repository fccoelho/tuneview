[project]
name = "tuneview"
version = "0.7.0"
description = "A leadsheet viewer for musicians: melody, chords and lyrics on the music stand"
authors = [{ name = "Flávio Codeço Coelho", email = "fccoelho@gmail.com" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # The desktop/web extras ship flet's runtime; without them flet tries to
    # pip-install it on first launch, and uv environments have no pip.
    "flet[desktop,web]>=1.1.2,<1.2",
    # Engraves MusicXML into notation (melody, chord symbols, lyrics) as SVG.
    "verovio>=6.4",
    # Rasterizes Verovio's SVG for display; Flet's SVG support can't draw it.
    "resvg-py>=0.2",
    # Playback: synthesize the melody and accompaniment, play them.
    "miniaudio>=1.73",
    "numpy>=2.0",
    # Plays the synthesized tune in the browser in the web version.
    "flet-audio>=1.1.2,<1.2",
]

[project.urls]
Homepage = "https://github.com/fccoelho/tuneview"
Source = "https://github.com/fccoelho/tuneview"
Issues = "https://github.com/fccoelho/tuneview/issues"

[project.scripts]
tuneview = "tuneview.app:run"
tuneview-import = "tuneview.importer:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Keep local environments, caches, build output and personal libraries out of
# the source distribution.  The wheel only contains src/tuneview, including
# its assets; the sdist also carries tests/docs/README/LICENSE.
exclude = [
    ".git",
    ".idea",
    ".mypy_cache",
    ".nox",
    ".pytest_cache",
    ".ruff_cache",
    ".uv-cache",
    ".venv",
    "__pycache__",
    "coverage",
    "dist",
    "graphify-out",
    "leadsheets.sqlite",
    "*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
